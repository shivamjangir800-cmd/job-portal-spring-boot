<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Company Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-primary text-white p-4">

                    <h3 class="mb-1">🏢 Company Profile</h3>

                    <p class="mb-0">
                        Add your company information
                    </p>

                </div>

                <div class="card-body p-4">

                    <form th:action="@{/recruiter/company/save}"
                          th:object="${company}"
                          method="post">

                        <!-- Company Name -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Company Name
                            </label>

                            <input type="text"
                                   th:field="*{name}"
                                   class="form-control"
                                   placeholder="Enter company name"
                                   required>

                        </div>


                        <!-- Description -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Company Description
                            </label>

                            <textarea th:field="*{description}"
                                      class="form-control"
                                      rows="5"
                                      placeholder="Tell candidates about your company">
                            </textarea>

                        </div>


                        <div class="row">

                            <!-- Industry -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-bold">
                                    Industry
                                </label>

                                <input type="text"
                                       th:field="*{industry}"
                                       class="form-control"
                                       placeholder="IT / Finance / Education">

                            </div>


                           

                        </div>


                        <div class="row">

                            <!-- Location -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-bold">
                                    Location
                                </label>

                                <input type="text"
                                       th:field="*{location}"
                                       class="form-control"
                                       placeholder="Jaipur, Rajasthan">

                            </div>


                            <!-- Founded Year -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-bold">
                                    Founded Year
                                </label>

                                <input type="number"
                                       th:field="*{foundedYear}"
                                       class="form-control"
                                       placeholder="2020">

                            </div>

                        </div>


                        <!-- Website -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Company Website
                            </label>

                            <input type="url"
                                   th:field="*{website}"
                                   class="form-control"
                                   placeholder="https://example.com">

                        </div>



                        <div class="d-flex gap-2">

                            <button type="submit"
                                    class="btn btn-primary px-4">

                                💾 Save Company

                            </button>

                            <a href="/recruiter/dashboard"
                               class="btn btn-outline-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
