<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Create Job - Recruiter</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">


</head>

<body class="bg-light">

<!-- Navbar -->

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/recruiter/dashboard">
            Job Portal
        </a>

    <div>
        <a href="/recruiter/dashboard" class="btn btn-light btn-sm me-2">
            Dashboard
        </a>

        <a href="/recruiter/jobs" class="btn btn-outline-light btn-sm">
            My Jobs
        </a>
    </div>
</div>

</nav>

<!-- Create Job Form -->

<div class="container mt-5 mb-5">
    
<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-header bg-primary text-white text-center">
                <h3 class="mb-0">Create New Job</h3>
            </div>

            <div class="card-body p-4">

                <form th:action="@{/recruiter/jobs/save}"
                      th:object="${job}"
                      method="post">

                    <!-- Job Title -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            Job Title
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{title}"
                               placeholder="Example: Java Backend Developer"
                               required>
                    </div>


                    <!-- Description -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            Job Description
                        </label>

                        <textarea class="form-control"
                                  th:field="*{description}"
                                  rows="5"
                                  placeholder="Enter job description..."
                                  required></textarea>
                    </div>


                    <!-- Location -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            Location
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{location}"
                               placeholder="Example: Jaipur, Rajasthan"
                               required>
                    </div>


                    <div class="row">

                        <!-- Salary -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-bold">
                                Salary
                            </label>

                            <input type="number"
                                   class="form-control"
                                   th:field="*{salary}"
                                   placeholder="Example: 500000"
                                   step="0.01"
                                   required>

                        </div>


                        <!-- Experience -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-bold">
                                Experience
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{experience}"
                                   placeholder="Example: 0-2 Years"
                                   required>

                        </div>

                    </div>


                    <!-- Skills -->
                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Required Skills
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{skills}"
                               placeholder="Example: Java, Spring Boot, MySQL, REST API"
                               required>

                        <div class="form-text">
                            Separate multiple skills using commas.
                        </div>

                    </div>


                    <!-- Status -->
                    <div class="mb-4">

                        <label class="form-label fw-bold">
                            Job Status
                        </label>

                        <select class="form-select"
                                th:field="*{status}">

                            <option value="OPEN">
                                Open
                            </option>

                            <option value="CLOSED">
                                Closed
                            </option>

                        </select>

                    </div>


                    <!-- Buttons -->
                    <div class="d-flex justify-content-between">

                        <a href="/recruiter/dashboard"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                        <button type="submit"
                                class="btn btn-primary">
                            Create Job
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</div>

</body>
</html>
