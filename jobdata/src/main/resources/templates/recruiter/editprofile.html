
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Recruiter Profile</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .profile-card {
            max-width: 850px;
            margin: 45px auto;
            border: none;
            border-radius: 18px;
            overflow: hidden;
        }

        .profile-header {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: white;
            padding: 30px;
        }

        .profile-icon {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: white;
            color: #0d6efd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
        }

        .form-label {
            font-weight: 600;
        }

        .btn {
            border-radius: 9px;
            padding: 10px 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card profile-card shadow">

        <!-- Header -->
        <div class="profile-header">
            <div class="d-flex align-items-center gap-3">
                <div class="profile-icon">👤</div>

                <div>
                    <h2 class="fw-bold mb-1">Edit Your Profile</h2>
                    <p class="mb-0">
                        Keep your recruiter information up to date.
                    </p>
                </div>
            </div>
        </div>

        <!-- Form -->
        <div class="card-body p-4 p-md-5">

            <form th:action="@{/recruiter/profile/update}"
                  th:object="${recruiter}"
                  method="post">

                <!-- ID -->
                <input type="hidden" th:field="*{id}">

                <div class="row g-4">

                    <!-- Name -->
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text"
                               th:field="*{name}"
                               class="form-control"
                               placeholder="Enter your full name"
                               required>
                    </div>

                    


                    

                </div>

                <hr class="my-4">

                <div class="d-flex flex-wrap gap-2">

                    <button type="submit" class="btn btn-primary">
                        💾 Save Changes
                    </button>

                    <a th:href="@{/recruiter/dashboard}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>

                </div>

            </form>

            <div th:if="${successMessage}"
                class="alert alert-success"
                th:text="${successMessage}">
            </div>

            <div th:if="${errorMessage}"
                class="alert alert-danger"
                th:text="${errorMessage}">
            </div>

        </div>
    </div>

</div>

</body>
</html>
