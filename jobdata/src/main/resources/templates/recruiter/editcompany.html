<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Company</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f5f7fb;
        }

        .edit-card {
            max-width: 800px;
            margin: 50px auto;
            border: none;
            border-radius: 18px;
        }

        .header {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: white;
            border-radius: 18px 18px 0 0;
        }

        .form-control {
            border-radius: 10px;
            padding: 11px;
        }

        .btn {
            border-radius: 10px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card edit-card shadow">

        <!-- Header -->

        <div class="header p-4">

            <h2 class="fw-bold mb-1">
                ✏️ Edit Company
            </h2>

            <p class="mb-0">
                Update your company information
            </p>

        </div>


        <!-- Form -->

        <div class="card-body p-4 p-md-5">

            <form th:action="@{/recruiter/company/update}"
                  th:object="${company}"
                  method="post">

                <!-- IMPORTANT: Company ID -->

                <input type="hidden"
                       th:field="*{id}">


                <!-- Company Name -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Company Name
                    </label>

                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           placeholder="Enter company name"
                           required>

                </div>


                <!-- Industry -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Industry
                    </label>

                    <input type="text"
                           th:field="*{industry}"
                           class="form-control"
                           placeholder="e.g. Information Technology">

                </div>


                <!-- Location -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Location
                    </label>

                    <input type="text"
                           th:field="*{location}"
                           class="form-control"
                           placeholder="e.g. Jaipur, Rajasthan">

                </div>


                <!-- Founded Year -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Founded Year
                    </label>

                    <input type="number"
                           th:field="*{foundedYear}"
                           class="form-control"
                           placeholder="e.g. 2020">

                </div>


                <!-- Website -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Company Website
                    </label>

                    <input type="url"
                           th:field="*{website}"
                           class="form-control"
                           placeholder="https://example.com">

                </div>


                <!-- Description -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Company Description
                    </label>

                    <textarea th:field="*{description}"
                              class="form-control"
                              rows="6"
                              placeholder="Describe your company..."></textarea>

                </div>


                <!-- Buttons -->

                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-primary px-4">

                        💾 Save Changes

                    </button>

                    <a th:href="@{/recruiter/company/profile/{id}(id=${company.id})}"
                       class="btn btn-outline-secondary px-4">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>

</html>
