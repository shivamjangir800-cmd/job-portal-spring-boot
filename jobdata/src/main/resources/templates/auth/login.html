<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - JobPortal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-header bg-primary text-white text-center">

                    <h3 class="mb-0">
                        JobPortal Login
                    </h3>

                </div>


                <div class="card-body p-4">


                    <!-- Error -->

                    <div th:if="${error}"
                         class="alert alert-danger"
                         th:text="${error}">
                    </div>


                    <!-- Logout -->

                    <div th:if="${message}"
                         class="alert alert-success"
                         th:text="${message}">
                    </div>


                    <!-- Login Form -->

                    <form th:action="@{/auth/login}"
                          method="post">


                        <!-- Email -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required>

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter your password"
                                required>

                        </div>


                        <!-- Login -->

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Login

                        </button>


                    </form>

                    <div class="text-end mb-4"> 
                        <a th:href="@{/auth/forgot-password}" class="forgot-link"> 
                            Forgot Password? 
                        </a> 
                    </div>


                    <!-- Register -->

                    <div class="text-center mt-4">

                        <p class="mb-1">
                            Don't have an account?
                        </p>

                        <a href="/auth/register"
                           class="btn btn-outline-primary">

                            Create Account

                        </a>

                    </div>


                </div>

            </div>

        </div>

    </div>

</div>


</body>
</html>
