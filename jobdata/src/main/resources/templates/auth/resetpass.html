
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-header bg-success text-white text-center">

                    <h3>Reset Password</h3>

                </div>

                <div class="card-body">

                    <div th:if="${error}"
                         class="alert alert-danger"
                         th:text="${error}">
                    </div>


                    <form th:action="@{/auth/resetpassword}"
                          method="post">

                        <!-- Email -->

                        <input type="hidden"
                               name="email"
                               th:value="${email}">


                        <!-- New Password -->

                        <div class="mb-3">

                            <label class="form-label">
                                New Password
                            </label>

                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Enter new password"
                                   minlength="6"
                                   required>

                        </div>


                        <!-- Confirm Password -->

                        <div class="mb-3">

                            <label class="form-label">
                                Confirm Password
                            </label>

                            <input type="password"
                                   name="confirmPassword"
                                   class="form-control"
                                   placeholder="Confirm password"
                                   minlength="6"
                                   required>

                        </div>


                        <button type="submit"
                                class="btn btn-success w-100">

                            Reset Password

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
