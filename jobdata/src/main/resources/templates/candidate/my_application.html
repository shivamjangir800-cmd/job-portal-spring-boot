
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Applications</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f5f7fb;
        }

        .sidebar {
            min-height: 100vh;
            background: #212529;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 13px 20px;
        }

        .sidebar a:hover {
            background: #343a40;
        }

        .application-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .status {
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .accepted {
            background: #d1e7dd;
            color: #0f5132;
        }

        .rejected {
            background: #f8d7da;
            color: #842029;
        }

    </style>

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- SIDEBAR -->

        <div class="col-md-2 sidebar p-0">

            <h3 class="text-white text-center py-4">
                Candidate
            </h3>

            <a th:href="@{/candidate/dashboard}">
                🏠 Dashboard
            </a>

            <a th:href="@{/candidate/jobs}">
                💼 Find Jobs
            </a>

            <a th:href="@{/candidate/applications}">
                📄 My Applications
            </a>

            <a th:href="@{/candidate/profile}">
                👤 My Profile
            </a>

            <form th:action="@{/logout}"
                  method="post"
                  class="p-3">

                <button type="submit"
                        class="btn btn-danger w-100">

                    Logout

                </button>

            </form>

        </div>


        <!-- MAIN CONTENT -->

        <div class="col-md-10 p-4">

            <div class="mb-4">

                <h2 class="fw-bold">
                    My Applications
                </h2>

                <p class="text-muted">
                    Track all jobs you have applied for.
                </p>

            </div>


            <!-- APPLICATIONS -->

            <div th:if="${applications != null and !applications.isEmpty()}">

                <div class="card application-card mb-4"
                     th:each="app : ${applications}">

                    <div class="card-body p-4">

                        <div class="row align-items-center">

                            <!-- JOB -->

                            <div class="col-md-4">

                                <h4 class="fw-bold"
                                    th:text="${app.jobs.title}">
                                    Java Developer
                                </h4>

                                <p class="text-muted mb-1">

                                    📍
                                    <span th:text="${app.jobs.location}">
                                        Jaipur
                                    </span>

                                </p>

                                <p class="text-muted">

                                    💰 ₹
                                    <span th:text="${app.jobs.salary}">
                                        500000
                                    </span>

                                </p>

                            </div>


                            <!-- APPLICATION -->

                            <div class="col-md-3">

                                <p class="mb-1">
                                    <strong>
                                        Application ID:
                                    </strong>
                                </p>

                                <p th:text="${app.id}">
                                    1
                                </p>

                            </div>


                            <!-- STATUS -->

                            <div class="col-md-2">

                                <strong>Status</strong>

                                <div class="mt-2">

                                    <span
                                        th:if="${app.status == 'PENDING'}"
                                        class="status pending">

                                        PENDING

                                    </span>

                                    <span
                                        th:if="${app.status == 'ACCEPTED'}"
                                        class="status accepted">

                                        ACCEPTED

                                    </span>

                                    <span
                                        th:if="${app.status == 'REJECTED'}"
                                        class="status rejected">

                                        REJECTED

                                    </span>

                                </div>

                            </div>


                            <!-- BUTTON -->

                            <div class="col-md-3 text-md-end">

                                <a th:href="@{/candidate/applications/{id}(id=${app.id})}"
                                   class="btn btn-primary">

                                    View Details

                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- EMPTY -->

            <div th:if="${applications == null or applications.isEmpty()}"
                 class="text-center mt-5">

                <div class="card border-0 shadow-sm p-5">

                    <h3>
                        No Applications Yet
                    </h3>

                    <p class="text-muted">
                        You have not applied for any jobs yet.
                    </p>

                    <a th:href="@{/candidate/jobs}"
                       class="btn btn-primary">

                        Find Jobs

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
